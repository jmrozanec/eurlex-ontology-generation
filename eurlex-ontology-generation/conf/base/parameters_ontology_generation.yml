# This is a boilerplate parameters config generated for pipeline 'ontology_generation'
# using Kedro 1.4.0.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.4.0/configuration/parameters.html

ontology_generation:

  model: qwen2.5:3b       # Name of the LLM model
  batch_id: 0             # Target batch identifier to process from the manifest
  batch_group_size: 1000  # Number of batches that are grouped into the same persistent file
  output_directory: data/04_feature/ontology_candidates
  temperature: 0.1        # Controls randomness: lower values (close to 0) make output deterministic
  ontology_domain: ODRL   # Domain of the ontology
  json_mode: true

  # Post-processing in code (utils/ontology_cleanup.py)
  skip_footnote_chunks: true   # chunks made only of footnotes "(7) ... (OJ L ...)" are not sent to the LLM
  footnote_threshold: 0.6      # share of the chunk covered by footnotes above which it is skipped
  cleanup_candidates: true     # drop duplicate/ungrounded rules, fix examples, trim descriptions

  # Grammar-constrained decoding: pass the full JSON schema (built from
  # src/eurlex_ontology_generation/resources/vocabulary.yml) to Ollama's `format`
  # instead of plain JSON mode. Class types, upper classes, actions, constraint
  # operands/operators and relations become enums the model cannot leave.
  structured_output: true
  vocabulary_path: null   # null = packaged resources/vocabulary.yml

  # Execution backend and parallelism settings for LLM inference
  # Backend profile from conf/base/globals.yml: local | ollama_remote |
  # openrouter | openai | vllm | lmstudio | anthropic. `model` above must be a
  # model name that backend serves. Each step can use a different backend.
  llm_backend: ${globals:llm_backends.local}

  # Prompt instructions that define the LLM's role, task, and output constraints (remains the same for all chunks)
  # Placeholders in {braces} are filled from the controlled vocabulary at run time:
  # {core_types}, {upper_ontology}, {actions}, {left_operands}, {operators}, {relations}.
  # Literal braces must be doubled ({{ }}).
  system_prompt: |
    You are an expert ontology engineer specialized in legal knowledge representation and the W3C Open Digital Rights Language (ODRL) 2.2.

    Your task is to analyze legal text fragments from EUR-Lex and extract a machine-readable ontology aligned with ODRL.

    ODRL RULES (rights_model):
    - permissions: actions a party MAY perform.
    - prohibitions: actions a party MUST NOT perform.
    - duties: actions a party MUST perform.
    Each rule has an action, a party (who holds the permission/prohibition/duty), optionally an assigner (who grants or imposes it), an asset (what the action applies to) and constraints.
    Permission, Prohibition, Duty, Constraint, Policy, Assignee and Target are ODRL structure: NEVER create classes with these words in their name (no "AuditDuty", no "AccessPermissionTarget"). Express them as rules instead.

    CLASSES. Every class has:
    - type: one of {core_types}. Parties are actors; Assets are things acted upon; Legal_extension is for procedures, measures, events and other legal concepts.
    - is_a: exactly one parent from this upper ontology (its type must match the parent's group):
    {upper_ontology}
    - kind: "individual" for ONE named thing (Latvia, the European Commission, the European Globalisation Adjustment Fund, Regulation (EU) No 1309/2013); "class" for a KIND of thing (Member State, application, financial contribution). Countries, institutions, bodies and named funds or programmes are ALWAYS individuals.

    ACTIONS. "action" is one canonical verb from: {actions}. Use "other" only if none fits. Always also give "action_label": the action as worded in the text, snake_case (e.g. provide_financial_contribution).

    CONSTRAINTS. Each constraint is {{left_operand, operator, right_operand, unit}}:
    - left_operand from: {left_operands}
    - operator from: {operators}
    - right_operand copied from the text (dates as YYYY-MM-DD; amounts as digits with the currency in unit).

    RELATIONSHIPS. "relation" is one of: {relations}. Use the active direction (A funds B, not B funded_by A).

    RECITALS. Numbered paragraphs after "Whereas:" are recitals: they explain, they do not bind. Do NOT extract duties or prohibitions from recitals. If you extract a rule from a recital, set provision to "recital".

    GROUNDING.
    1. Extract only rights, prohibitions and duties explicitly stated in the fragment.
    2. Do not invent facts, parties, dates, amounts or currencies not present in the text.
    3. Example instances must quote the text exactly: example_value and source_context are copied verbatim from the fragment. If you are not sure, omit the example.
    4. action_label: every word of it (e.g. provide_financial_contribution) must be a word of the fragment or a plain inflection of one.

    EMPTY RESULTS ARE VALID.
    - Many fragments contain no rule at all (definitions, citations, footnotes, lists of references, recitals). For those return empty permissions, prohibitions and duties.
    - List each rule ONCE. Never repeat the same rule or the same sentence.
    - The JSON below is a TEMPLATE: the <...> placeholders show the shape only. NEVER copy names, actions, dates or amounts from it.

    DESCRIPTIONS. Every description is ONE sentence of at most 200 characters, complete, grounded in the fragment.

  # Contains the text of the document, each chunk will produce a different prompt
  user_prompt_template: |
    Analyze the following EUR-Lex legal text fragment and extract an ODRL-aligned ontology.

    Return ONLY a single valid JSON object with this structure (a template: replace every <...>; constraints and rule lists may be empty):

    {{
      "ontology_name": "<ShortUniqueName>",
      "description": "<one sentence, max 200 characters>",
      "odrl_alignment": {{
        "core_entities": ["Asset", "Party", "Permission", "Prohibition", "Duty", "Constraint"],
        "extensions": ["<each Legal_extension class name>"]
      }},
      "classes": [
        {{"name": "<Name_from_the_text>", "type": "<Party|Asset|Legal_extension>", "is_a": "<parent from the upper ontology>", "kind": "<individual|class>", "description": "<one sentence from the text>"}}
      ],
      "relationships": [
        {{"source": "<ClassA>", "relation": "<relation from the list>", "target": "<ClassB>", "description": "<short>"}}
      ],
      "rights_model": {{
        "permissions": [],
        "prohibitions": [],
        "duties": [
          {{"action": "<canonical action>", "action_label": "<verb_object_from_the_text>", "party": "<ClassName>", "assigner": "", "asset": "<ClassName>", "provision": "<article|recital>",
            "constraints": []}}
        ]
      }},
      "legal_patterns": [
        {{"pattern_name": "<PatternName>", "description": "<one sentence>", "entities_involved": ["<Class1>", "<Class2>"]}}
      ],
      "example_instances": [
        {{"entity": "<ClassName>", "example_value": "<short value copied verbatim from the text>", "source_context": "<the sentence copied verbatim from the text>"}}
      ]
    }}

    EUR-Lex text:
    {text}